zeroCostEntries:
  get:
    tags:
      - ZeroCostEntries
    operationId: findAllZeroCostEntries
    summary: List zero cost entries
    responses:
      '200':
        description: Zero cost entries found
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/zero-cost-entry.yaml#/ZeroCostEntryResponse'

  post:
    tags:
      - ZeroCostEntries
    operationId: createZeroCostEntry
    summary: Create zero cost entry
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/zero-cost-entry.yaml#/ZeroCostEntryCreateRequest'
    responses:
      '200':
        description: Zero cost entry created
        content:
          application/json:
            schema:
              $ref: '../schemas/zero-cost-entry.yaml#/ZeroCostEntryResponse'

zeroCostEntryById:
  get:
    tags:
      - ZeroCostEntries
    operationId: findZeroCostEntryById
    summary: Find zero cost entry by id
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Zero cost entry found
        content:
          application/json:
            schema:
              $ref: '../schemas/zero-cost-entry.yaml#/ZeroCostEntryResponse'