SellableStockUpsertRequest:
  type: object
  required:
    - infinite
    - active
  properties:
    infinite:
      type: boolean
    active:
      type: boolean

SellableStockCatalogResponse:
  type: object
  properties:
    itemId:
      type: integer
      format: int64
    itemName:
      type: string
    pricePf:
      type: number
    pricePj:
      type: number
    infinite:
      type: boolean
    active:
      type: boolean

SellableStockAdminResponse:
  type: object
  properties:
    itemId:
      type: integer
      format: int64
    itemName:
      type: string
    currentStockQuantity:
      type: number
    pricePf:
      type: number
    pricePj:
      type: number
    infinite:
      type: boolean
    active:
      type: boolean
