salesSummary:
  get:
    tags:
      - SalesReports
    operationId: getSalesSummary
    summary: Get sales summary by period
    description: Aggregates the real sold amount, cost and gross profit for the period. PF, PJ and guest sales are already reflected in the stored order totals.
    parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Sales summary
        content:
          application/json:
            schema:
              $ref: '../schemas/sales-report.yaml#/SalesSummaryResponse'

salesProductPerformance:
  get:
    tags:
      - SalesReports
    operationId: getSalesProductPerformance
    summary: Get sales product performance by period
    description: Groups product performance using the actual sold price stored on each order item, so PF and PJ prices remain consistent in reporting.
    parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Sales product performance
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/sales-report.yaml#/SalesProductPerformanceResponse'
