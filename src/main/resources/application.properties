spring.application.name=bratatouille-management

server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bratatouille_management}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Se quiser deletar o banco toda vez que rodar o proj
spring.jpa.hibernate.ddl-auto=create-drop

# Se quiser guardar infos do banco apos criar
##spring.jpa.hibernate.ddl-auto=update


spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.time-zone=America/Sao_Paulo

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always