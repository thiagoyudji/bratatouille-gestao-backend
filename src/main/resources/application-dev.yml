spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bratatouille_management}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:change-me-in-development-change-me-in-development}
    expiration-minutes: ${AUTH_JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    root: INFO
    br.com.bratatouille.management: DEBUG
