ProductionSimulationItemResponse:
  type: object
  properties:
    itemId:
      type: integer
      format: int64
    itemName:
      type: string
    itemType:
      type: string
      enum: [INGREDIENT, PACKAGING]
    requiredQuantity:
      type: number
    usableQuantity:
      type: number
    lossQuantity:
      type: number
    yieldPercentage:
      type: number
    currentStock:
      type: number
    missingQuantity:
      type: number
    unitCost:
      type: number
    totalCost:
      type: number

ProductionSimulationResponse:
  type: object
  properties:
    recipeId:
      type: integer
      format: int64
    recipeName:
      type: string
    outputItemId:
      type: integer
      format: int64
    outputItemName:
      type: string
    quantity:
      type: number
      nullable: true
      description: Estimated pots that can be produced from the supplied inputs
    estimatedTotalCost:
      type: number
    planningNote:
      type: string
      nullable: true
      description: Explanation of incomplete estimates, especially when recipe yield is unknown.
    items:
      type: array
      items:
        $ref: '#/ProductionSimulationItemResponse'
ProductionSimulationRequest:
  type: object
  required:
    - recipeId
  properties:
    recipeId:
      type: integer
      format: int64
    plannedFinishedQuantity:
      type: number
      nullable: true
      description: Optional planned number of finished pots; used to estimate packaging without inferring recipe yield.
    inputs:
      type: array
      description: Optional when plannedFinishedQuantity is supplied to plan from target pots.
      items:
        $ref: '#/ProductionSimulationInputRequest'

ProductionSimulationInputRequest:
  type: object
  required:
    - itemId
    - quantity
  properties:
    itemId:
      type: integer
      format: int64
    quantity:
      type: number
