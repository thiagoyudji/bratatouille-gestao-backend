name: Deploy production

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_ID: project-4c4e2300-94cd-4054-992
  REGION: southamerica-east1
  SERVICE: bratatouille-backend-prod
  IMAGE: southamerica-east1-docker.pkg.dev/project-4c4e2300-94cd-4054-992/bratatouille/bratatouille-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw test

  deploy:
    name: Deploy to Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build --tag="${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --platform=managed \
            --port=8080 \
            --allow-unauthenticated \
            --set-env-vars="^|^SPRING_PROFILES_ACTIVE=prod|DATABASE_URL=${DATABASE_URL}|DATABASE_USERNAME=${DATABASE_USERNAME}|DATABASE_PASSWORD=${DATABASE_PASSWORD}|AUTH_JWT_SECRET=${AUTH_JWT_SECRET}"
