infinitePayWebhook:
  post:
    tags:
      - Payments
    operationId: handleInfinitePayWebhook
    summary: Handle InfinitePay payment webhook
    description: Receives an InfinitePay approved-payment notification, confirms it through payment_check and reconciles the internal sales order.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/payments.yaml#/InfinitePayWebhookRequest'
    responses:
      '200':
        description: Webhook processed
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/InfinitePayWebhookResponse'
      '400':
        description: Webhook rejected; InfinitePay may retry the notification
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/InfinitePayWebhookResponse'

createInfinitePayCheckout:
  post:
    tags:
      - Payments
    operationId: createInfinitePayCheckout
    summary: Create an InfinitePay checkout for a pending sales order
    description: Creates the sales order, reserves stock and generates the InfinitePay checkout URL. Anonymous requests are treated as guest with PF price; authenticated customers have identity and PF/PJ type resolved by the backend.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/sales-order.yaml#/SalesOrderCreateRequest'
    responses:
      '200':
        description: Checkout created
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/InfinitePayCheckoutResponse'
