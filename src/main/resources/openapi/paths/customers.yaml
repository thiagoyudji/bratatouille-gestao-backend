myCustomerProfile:
  get:
    tags:
      - Customers
    operationId: getMyCustomerProfile
    summary: Get the authenticated customer profile
    responses:
      '200':
        description: Customer profile found
        content:
          application/json:
            schema:
              $ref: '../schemas/customer.yaml#/CustomerProfileResponse'

  put:
    tags:
      - Customers
    operationId: updateMyCustomerProfile
    summary: Update the authenticated customer profile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/customer.yaml#/CustomerProfileRequest'
    responses:
      '200':
        description: Customer profile updated
        content:
          application/json:
            schema:
              $ref: '../schemas/customer.yaml#/CustomerProfileResponse'
