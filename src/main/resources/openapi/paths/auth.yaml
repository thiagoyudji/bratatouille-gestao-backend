bootstrapAdmin:
  post:
    tags:
      - Auth
    operationId: bootstrapAdmin
    summary: Bootstrap the first admin user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/BootstrapAdminRequest'
    responses:
      '200':
        description: Admin user created
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'

dashboardLogin:
  post:
    tags:
      - Auth
    operationId: loginDashboard
    summary: Login for dashboard users
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Token issued
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'

ecommerceLogin:
  post:
    tags:
      - Auth
    operationId: loginEcommerce
    summary: Login for ecommerce customers
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Token issued
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'

ecommerceRegister:
  post:
    tags:
      - Auth
    operationId: registerCustomer
    summary: Register a new ecommerce customer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/RegisterCustomerRequest'
    responses:
      '200':
        description: Customer registered
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'

dashboardUsers:
  post:
    tags:
      - Auth
    operationId: createDashboardUser
    summary: Create a dashboard user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/CreateDashboardUserRequest'
    responses:
      '200':
        description: Dashboard user created
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'
