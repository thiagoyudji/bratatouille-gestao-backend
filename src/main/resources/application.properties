spring.application.name=bratatouille-management

server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bratatouille_management}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.time-zone=America/Sao_Paulo

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Auth
auth.jwt.secret=${AUTH_JWT_SECRET:change-me-in-production-change-me-in-production-change-me}
auth.jwt.expiration-minutes=${AUTH_JWT_EXPIRATION_MINUTES:480}
# Logs temporarios para diagnosticar autenticao
logging.level.root=INFO
logging.level.br.com.bratatouille.management=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
