ProductionCreateRequest:
  type: object
  required:
    - recipeId
    - producedQuantity
  properties:
    recipeId:
      type: integer
      format: int64
    producedQuantity:
      type: number
    items:
      type: array
      description: Actual ingredient quantities are required when yield is unknown. Packaging is calculated per finished unit from recipe entries; optional packaging quantities override the default to account for losses and must not be lower than the calculated minimum.
      items:
        $ref: '#/ProductionConsumedItemRequest'

ProductionItemResponse:
  type: object
  properties:
    itemId:
      type: integer
      format: int64
    itemName:
      type: string
    consumedQuantity:
      type: number
    usableQuantity:
      type: number
    lossQuantity:
      type: number
    yieldPercentage:
      type: number
    unitCost:
      type: number
    totalCost:
      type: number

ProductionResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    recipeId:
      type: integer
      format: int64
    recipeName:
      type: string
    outputItemId:
      type: integer
      format: int64
    outputItemName:
      type: string
    productionDate:
      type: string
      format: date
    producedQuantity:
      type: number
    totalCost:
      type: number
    unitCost:
      type: number
    lotId:
      type: integer
      format: int64
    lotExpirationDate:
      type: string
      format: date
    items:
      type: array
      items:
        $ref: '#/ProductionItemResponse'
    createdAt:
      type: string
      format: date-time
ProductionConsumedItemRequest:
  type: object
  required: [itemId, quantity]
  properties:
    itemId:
      type: integer
      format: int64
    quantity:
      type: number
      minimum: 0
      exclusiveMinimum: true
