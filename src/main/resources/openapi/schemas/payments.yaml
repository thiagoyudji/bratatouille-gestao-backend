InfinitePayWebhookRequest:
  type: object
  description: Payload sent by the InfinitePay integrated checkout after an approved payment.
  required:
    - invoice_slug
    - amount
    - paid_amount
    - transaction_nsu
    - order_nsu
  example:
    invoice_slug: abc123
    amount: 1850
    paid_amount: 1850
    installments: 1
    capture_method: pix
    transaction_nsu: TXN-987654321
    order_nsu: '123'
    receipt_url: https://example.com/receipt/123
  properties:
    invoice_slug:
      type: string
      description: InfinitePay invoice identifier.
    amount:
      type: integer
      format: int64
      minimum: 1
      description: Order amount in cents.
    paid_amount:
      type: integer
      format: int64
      minimum: 1
      description: Amount effectively paid in cents, which may include financing costs.
    installments:
      type: integer
      format: int32
      minimum: 1
    capture_method:
      type: string
      description: Payment method reported by the provider.
    transaction_nsu:
      type: string
      description: Unique provider transaction identifier.
    order_nsu:
      type: string
      description: Internal sales order identifier sent when the checkout was created.
    receipt_url:
      type: string
      description: Provider receipt URL when available.

InfinitePayWebhookResponse:
  type: object
  required:
    - success
  properties:
    success:
      type: boolean
    message:
      type: string
      nullable: true

InfinitePayCheckoutResponse:
  type: object
  description: Checkout created for the InfinitePay provider, linked to a pending sales order.
  example:
    provider: INFINITEPAY
    orderId: 123
    checkoutUrl: https://buy.infinitepay.io/checkout/abc123
    invoiceSlug: abc123
    paymentStatus: PENDING
  properties:
    provider:
      type: string
    orderId:
      type: integer
      format: int64
    checkoutUrl:
      type: string
    invoiceSlug:
      type: string
    paymentStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - DECLINED
        - CANCELED
