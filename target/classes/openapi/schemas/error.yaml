ApiErrorResponse:
  type: object
  required:
    - timestamp
    - status
    - error
    - code
    - message
    - path
    - method
  properties:
    timestamp:
      type: string
      format: date-time
      description: Momento em que o erro foi gerado.
    status:
      type: integer
      format: int32
      description: Status HTTP retornado.
    error:
      type: string
      description: Categoria humana do erro.
    code:
      $ref: '#/ApiErrorCode'
    message:
      type: string
      description: Mensagem pública em português.
    path:
      type: string
      description: Caminho da requisição.
    method:
      type: string
      description: Método HTTP da requisição.
    traceId:
      type: string
      description: Identificador de correlação do erro.
    fieldErrors:
      type: array
      items:
        $ref: '#/ApiFieldErrorResponse'

ApiFieldErrorResponse:
  type: object
  required:
    - field
    - code
    - message
  properties:
    field:
      type: string
      description: Campo com erro.
    code:
      type: string
      description: Código da violação do campo.
    message:
      type: string
      description: Mensagem pública do campo.

ApiErrorCode:
  type: string
  description: Códigos estáveis de erro suportados pela API.
  enum:
    - VALIDATION_ERROR
    - INVALID_REQUEST
    - BUSINESS_RULE_VIOLATION
    - NOT_FOUND
    - CONFLICT
    - UNAUTHORIZED
    - FORBIDDEN
    - AUTH_INVALID_CREDENTIALS
    - AUTH_USER_INACTIVE
    - AUTH_LOGIN_NOT_ALLOWED
    - AUTH_BOOTSTRAP_ALREADY_COMPLETED
    - AUTH_USERNAME_ALREADY_EXISTS
    - AUTH_CUSTOMER_ROLE_VIA_ECOMMERCE
    - INTERNAL_SERVER_ERROR
