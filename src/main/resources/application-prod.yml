spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Configure DATABASE_URL without credentials and provide the credentials separately.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-minutes: ${AUTH_JWT_EXPIRATION_MINUTES:480}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    br.com.bratatouille.management: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
