CreateItemRequest:
  type: object
  description: Cadastro base de item. Preços de venda são definidos no estoque fake.
  required:
    - name
    - type
    - baseUnit
  example:
    name: Pão de queijo
    type: FINISHED_PRODUCT
    baseUnit: UN
  properties:
    name:
      type: string
    type:
      type: string
      enum:
        - INGREDIENT
        - PACKAGING
        - FINISHED_PRODUCT
    baseUnit:
      type: string
      enum:
        - G
        - ML
        - UN
    lowStockThreshold:
      type: number
    criticalStockThreshold:
      type: number
    pricePf:
      type: number
      description: Campo legado; preços devem ser definidos no estoque fake.
    pricePj:
      type: number
      description: Campo legado; preços devem ser definidos no estoque fake.

UpdateItemRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    lowStockThreshold:
      type: number
    criticalStockThreshold:
      type: number
    pricePf:
      type: number
      description: Campo legado opcional; preço PF deve ser definido no estoque fake.
    pricePj:
      type: number
      description: Campo legado opcional; preço PJ deve ser definido no estoque fake.
    active:
      type: boolean

ItemResponse:
  type: object
  description: Item persistido. Preços de venda, quando aplicáveis, são controlados no estoque fake.
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    type:
      type: string
      enum:
        - INGREDIENT
        - PACKAGING
        - FINISHED_PRODUCT
    baseUnit:
      type: string
      enum:
        - G
        - ML
        - UN
    active:
      type: boolean
    lowStockThreshold:
      type: number
    criticalStockThreshold:
      type: number
    pricePf:
      type: number
      example: 12.9
    pricePj:
      type: number
      example: 15.9
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
