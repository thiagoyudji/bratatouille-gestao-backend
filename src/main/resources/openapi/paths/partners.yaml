partners:
  get:
    tags:
      - Partners
    operationId: findAllPartners
    summary: List all partners
    responses:
      '200':
        description: Partners found
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/partner.yaml#/PartnerResponse'

  post:
    tags:
      - Partners
    operationId: createPartner
    summary: Create partner
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/partner.yaml#/CreatePartnerRequest'
    responses:
      '200':
        description: Partner created
        content:
          application/json:
            schema:
              $ref: '../schemas/partner.yaml#/PartnerResponse'

partnerById:
  get:
    tags:
      - Partners
    operationId: findPartnerById
    summary: Find partner by id
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Partner found
        content:
          application/json:
            schema:
              $ref: '../schemas/partner.yaml#/PartnerResponse'

associatePartnerUser:
  put:
    tags:
      - Partners
    operationId: associatePartnerUser
    summary: Associate a partner with an admin dashboard user
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/partner.yaml#/AssociatePartnerUserRequest'
    responses:
      '200':
        description: Partner associated with the dashboard user
        content:
          application/json:
            schema:
              $ref: '../schemas/partner.yaml#/PartnerResponse'
      '400':
        description: User is not an ADMIN
      '404':
        description: Partner or user not found
      '409':
        description: Partner or user is already associated
